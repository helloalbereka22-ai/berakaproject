name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: albareka_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    env:
      APP_ENV: testing
      APP_KEY: base64:dGhpc2lzYXRlc3RrZXlmb3JnaXRodWJhY3Rpb25z
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: albareka_test
      DB_USERNAME: root
      DB_PASSWORD: password

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, bcmath, redis
          coverage: none

      - name: Composer Install
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: NPM Install
        run: npm ci

      - name: Build Assets
        run: npm run build

      - name: Laravel Pint (Code Style)
        run: vendor/bin/pint --test

      - name: PHPStan / Larastan (Static Analysis)
        run: vendor/bin/phpstan analyse --memory-limit=512M
        continue-on-error: true

      - name: Run Migrations
        run: php artisan migrate --force

      - name: Run Tests (Pest / PHPUnit)
        run: php artisan test --parallel
